[package]
name = "portreaper"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
chrono = "0.4"
clap = { version = "4.6.0", features = ["derive"] }
dirs = "6.0.0"
is-terminal = "0.4.17"
owo-colors = { version = "4.3.0", features = ["supports-colors"] }
quick-xml = { version = "0.39.2", features = ["serialize"] }
regex = "1.12.3"
reqwest = { version = "0.13.2", features = ["json", "query", "rustls"] }
sanitize-filename = "0.6.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yml = "0.0.12"
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["full"] }

[dev-dependencies]
tempfile = "3"
